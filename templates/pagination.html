{% if page_obj.has_other_pages %}
<div class="card-body" style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--border-light);font-size:13px">
    <div style="display:flex;gap:8px">
        {% if page_obj.has_previous %}
        <a href="?{% if q %}q={{ q }}&{% endif %}{% if status %}status={{ status }}&{% endif %}{% if category %}category={{ category }}&{% endif %}{% if priority %}priority={{ priority }}&{% endif %}page={{ page_obj.previous_page_number }}" class="btn btn-sm btn-secondary">Previous</a>
        {% endif %}
    </div>
    <span style="color:var(--text-secondary)">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} total)</span>
    <div style="display:flex;gap:8px">
        {% if page_obj.has_next %}
        <a href="?{% if q %}q={{ q }}&{% endif %}{% if status %}status={{ status }}&{% endif %}{% if category %}category={{ category }}&{% endif %}{% if priority %}priority={{ priority }}&{% endif %}page={{ page_obj.next_page_number }}" class="btn btn-sm btn-secondary">Next</a>
        {% endif %}
    </div>
</div>
{% endif %}
